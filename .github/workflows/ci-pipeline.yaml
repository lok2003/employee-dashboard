name: CI-pipeline 
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout code 
        uses: actions/checkout@v4 
        # fetch-depth: 0
      - name: Set-up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci 
      - name: Build application
        run: npm run build 
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
  docker-image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout-code 
        uses: actions/checkout@v4
      - name: login to DockerHub 
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.Docker_PASSWORD }}
      - name: Docker Build 
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/employee-dashboard:${{ github.sha }} .
      - name: Docker Push 
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/employee-dashboard:${{ github.sha }}            

