name: CI-pipeline 
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout code 
        uses: actions/checkout@v4 
        # fetch-depth: 0
      - name: Set-up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci 
      - name: Build application
        run: npm run build 
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
  backend:
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout-code 
        uses: actions/checkout@v4 

      - name: set up python
        uses: actions/setup-python@v5 
        with:
          python-version: '3.12'

      - name: install Depnendencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip 
          pip install -r requirements.txt 
          pip install build 

      - name: Build 
        working-directory: backend/app
        run: python -m build 

      - name: Upload Artifacts 
        uses: actions/upload-artifact@v4 
        with:
          name: python-artifact
          path: backend/app/dist/ 

  docker-image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout-code 
        uses: actions/checkout@v4
      - name: Set Docker image version
        run: echo "VERSION=v1.${{ github.run_number }}" >> $GITHUB_ENV
      - name: login to DockerHub 
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.Docker_PASSWORD }}
      - name: Docker Build 
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-dashboard:${VERSION} .
      - name: Docker Push 
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend-dashboard:${VERSION}            
  
  docker-image-backend:
    needs: backend 
    runs-on: ubuntu-latest 
    steps: 
      - name: Checkout-code 
        uses: actions/checkout@v4 

      - name: Set Docker Version
        run: echo "VERSION=v2.${{ github.run_number }}" >> $GITHUB_ENV 

      - name: Login Dockerhub 
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Docker build 
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:${VERSION} \
          -f backend/Dockerfile \
          backend 

      - name: Docker Push 
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/backend:${VERSION}
