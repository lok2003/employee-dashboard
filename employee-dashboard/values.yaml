cloud:
  provider: aws 

namespace:
  name: dashboard 
replicaCount: 1

selectorLabels:
  app: frontend

labels:
  app: frontend
  tier: frontend
  version: v1.0.0

image:
  repository: lok2003/frontend-dashboard
  tag: v1.11
  pullPolicy: IfNotPresent 

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

readiness:
  httpGet:
    path: /
    port: 80 
  initialDelaySeconds: 15
  periodSeconds: 10
liveness:
  httpGet: 
    path: /
    port: 80 
  initialDelaySeconds: 20
  periodSeconds: 15 
startup:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  failureThreshold: 20  

service:
  enabled: true
  type: ClusterIP 
  protocol: TCP  
  port: 80 
  targetPort: 80

configmap:
  enabled: true
  data:
    APP_NAME: "Employee Dashboard"
    APP_VERSION: "v1.0.0"
  
secret:
  enabled: true
  type: Opaque
  stringData:
    DB_USERNAME: "admin"
    DB_PASSWORD: "password123"


pvc:
  enabled: true  
  storageClass: 
    azure: managed-csi 
    aws: gp2 
  # azure:
  #   storageClassName: "default"
  # aws:
  #   storageClassName: gp2 
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi


ingress:
  enabled: true
  # annotations:
  #   nginx.ingress.kubernetes.io/use-regex: "true"
  #   nginx.ingress.kubernetes.io/rewrite-target: /$2
  className: nginx
  hosts:
  - host: example.com 
    paths:
      # - path: /nginx(/|$)(.*)
      #   pathType: ImplementationSpecific
      - path: /
        pathType: Prefix 
        backend:
          service:
            name:  employee-dashboard-service
            port: 
              number: 80  
      - path: /api 
        pathType: Prefix
        backend:
          service:
            name:  employee-dashboard-backend-service
            port:
              number: 8000



backend:
  replicaCount: 1
  selectorLabels:
    app: backend 
  labels:
    app: backend
    tier: backend
    version: v1.0.0
  image: 
    name: backend-deployment
    repository: lok2003/backend
    tag: v2.23
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits: 
      cpu: 1000m
      memory: 512Mi
  readiness:
    httpGet:
      path: /api/health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    httpGet:
      path: /api/health
      port: 8000
    initialDelaySeconds: 20
    periodSeconds: 15
  startup:
    httpGet:
      path: /api/health
      port: 8000
    initialDelaySeconds: 10
    failureThreshold: 30
    periodSeconds: 10

  service:
    type: ClusterIP
    port: 8000 
    targetPort: 8000 
    protocol: TCP 
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: example.com 
        paths:
          - path: /api 
            pathType: Prefix
            backend:
              service:
                port: 
                  number: 8000
     


