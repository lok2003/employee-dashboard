apiVersion: v1
kind: Service 
metadata:
  name: {{ include "frontend-name" . }}-backend-service
  namespace: {{ include "frontend-namespace" . }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
  {{- range $key, $value := .Values.backend.selectorLabels }}
    {{ $key }}: {{ $value | quote }}
  {{- end }}
  ports:
    - protocol: {{ .Values.backend.service.protocol }}
      targetPort: {{ .Values.backend.service.targetPort }}
      port: {{ .Values.backend.service.port }}
      