{{- if .Values.pvc.enabled }}
apiVersion: v1 
kind: PersistentVolumeClaim 
metadata:
  name: {{ include "frontend-name" . }}-pvc
  namespace: {{ include "frontend-namespace" . }}
spec:
  accessModes:
    {{- toYaml .Values.pvc.accessModes | nindent 4 }}

{{- if eq .Values.cloud.provider "azure" }}
  storageClassName: {{ .Values.pvc.storageClass.azure | quote }}
{{- else if eq .Values.cloud.provider "aws" }}
  storageClassName: {{ .Values.pvc.storageClass.aws | quote }}
{{- end }}

  resources:
    {{- toYaml .Values.pvc.resources | nindent 4  }}   
{{- end }}