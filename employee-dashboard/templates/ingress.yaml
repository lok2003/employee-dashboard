{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1 
kind: Ingress 
metadata: 
  name: {{ include "frontend-name" . }}-ingress
  namespace: {{ include "frontend-namespace" . }}
  
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
   {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "frontend-name" $ }}-service
                port:
                  number: {{ .backend.service.port.number }}
            {{- end}}
      {{- end }}
{{- end }}